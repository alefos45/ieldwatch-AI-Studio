name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  # Fuerza a las actions viejas (Node 20) a correr en Node 24.
  # Necesario porque android-actions/setup-android@v3 aún no publicó
  # una versión con Node 24. Se aplica a todo el workflow.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        # v5 ya está en Node 24 nativo, sin deprecation warnings.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      # Descomenta estas dos líneas cuando apliquemos el build.gradle.kts
      # con Robolectric y las dependencias de test.
      # - name: Run tests
      #   run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldwatch-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30